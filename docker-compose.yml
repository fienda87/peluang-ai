name: peluang-ai

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: peluang
      POSTGRES_PASSWORD: peluang_dev
      POSTGRES_DB: peluang
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peluang -d peluang"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://peluang:peluang_dev@postgres:5432/peluang
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://peluang:peluang_dev@postgres:5432/peluang
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m arq app.workers.settings.WorkerSettings

volumes:
  pgdata:
  storage_data:

[project]
name = "peluang-ai"
version = "0.1.0"
description = "Personal Opportunity Intelligence Platform for Indonesian students"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pgvector>=0.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
]

[project.optional-dependencies]
ingestion = [
    "feedparser>=6.0",
    "pypdf>=4.3",
    "pytesseract>=0.3",
    "Pillow>=10.4",
    "crawl4ai>=0.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"scripts/**" = ["E501"]
"app/modules/**/service.py" = ["E501"]
"app/modules/extraction/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
